name: Comprobar bloqueos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comprobar
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Comprobar estado
        run: python3 comprobar.py

      - name: Publicar cambios
        run: |
          [ -f .publicar ] || exit 0
          git config user.name "estado-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Estado $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          # Si GitHub falla un momento o alguien ha subido algo mientras tanto, se reintenta (hasta 4 veces)
          for i in 1 2 3 4; do
            git push && exit 0
            echo "El push ha fallado (intento $i); se reintenta en $((i * 10)) s"
            sleep $((i * 10))
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; git reset --hard "origin/${GITHUB_REF_NAME}"; exit 0; }
          done
          echo "::warning::No se ha podido publicar; lo hará la próxima comprobación"
